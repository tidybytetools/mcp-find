# Community-submitted MCP servers
# Add your server by opening a PR. See CONTRIBUTING.md for guidelines.
#
# Required fields: name, github_url, package_name, description
# Optional fields: package_type (npm|pypi|docker), category
servers:
  - name: "BuyWhere MCP Server"
    github_url: "https://github.com/BuyWhere/buywhere-mcp"
    package_name: "@buywhere/mcp-server"
    description: "Search and compare products from Singapore, SEA, and US markets via Model Context Protocol. Cross-border e-commerce product catalog for AI agents."
    package_type: "npm"
    category: "other"
  - name: "Xquik"
    github_url: "https://github.com/Xquik-dev/x-twitter-scraper"
    package_name: "x-developer"
    description: "X and Twitter automation MCP server for tweet search, profile tweets, follower export, media workflows, webhooks, and confirmation-gated posting."
    package_type: "npm"
    category: "communication"
  - name: "pdf-table-pull-lite"
    github_url: "https://github.com/tidybytetools/pdf-table-pull-lite"
    package_name: "pdf-table-pull-lite"
    description: "Pulls tables out of local text PDFs as CSV, with no OCR and no API key."
    package_type: "pypi"
    category: "filesystems"
  - name: "doc2md-lite"
    github_url: "https://github.com/tidybytetools/doc2md-lite"
    package_name: "doc2md-lite"
    description: "Turns local text PDFs and HTML files into Markdown and keeps tables as Markdown tables."
    package_type: "pypi"
    category: "documentation"
  - name: "link-check-lite"
    github_url: "https://github.com/tidybytetools/link-check-lite"
    package_name: "link-check-lite"
    description: "Checks a list of links and reports each status code, final URL and redirect chain."
    package_type: "pypi"
    category: "devtools"
